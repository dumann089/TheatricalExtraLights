architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
}

configurations {
    shadowCommon
}
configurations.all {
    // Check for updates every build
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

sourceSets {
    main {
        resources.srcDir file("src/generated/resources")
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    // ← Agregá esto
    from project(":common").sourceSets.main.resources
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    // Theatrical
    modImplementation group: "dev.imabad", name: "Theatrical", version: "${theatrical_version}", changing: true
    implementation "ch.bildspur:artnet4j:0.6.3"

    // Compile against local Theatrical-official when Maven is behind (DmxFrame batch API).
    def theatricalApiClasses = file("${rootDir}/../Theatrical-official-1.20.1/common/build/classes/java/main")
    if (theatricalApiClasses.exists()) {
        compileOnly files(theatricalApiClasses)
    }

    if (rootProject.include_shimmer == "true") {
        modCompileOnly "com.lowdragmc.shimmer:Shimmer-common:${rootProject.shimmer_version}"
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
