

plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "theatricalextralights-common.mixins.json"
    }

    runs {
        data {
            data()
            programArgs "--all", "--mod", "theatricalextralights"
            programArgs '--output', project(':common').file('src/generated/resources').absolutePath
            programArgs '--existing', file('src/main/resources').absolutePath
            programArgs '--existing', project(':common').file('src/main/resources').absolutePath
            programArgs '--existing-mod', 'theatricalextralights'
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    forgeRuntimeLibrary "ch.bildspur:artnet4j:0.6.3"
    forgeRuntimeLibrary "org.yaml:snakeyaml:2.2"
    forgeRuntimeLibrary 'com.sun.activation:javax.activation:1.2.0'
    // Theatrical
    modImplementation  "dev.imabad:Theatrical-forge:${theatrical_version}"
//    implementation  "dev.imabad:Theatrical-forge:${theatrical_version}"


    if(include_shimmer == "true") {
        // Shimmer
        modImplementation("com.lowdragmc.shimmer:Shimmer-forge:${shimmer_version}") {
            exclude group: "maven.modrinth"
            exclude group: "icyllis.modernui"
            exclude group: "com.jozufozu.flywheel"
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    dependsOn shadowJar

    archiveBaseName.set("${rootProject.archives_base_name}-${project.name}")
    archiveClassifier = null
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
